    <base href="/" />
    <link rel="preload" id="webassembly" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">

    <!-- Icons -->

    <!-- Map -->

    <!-- App styles -->

    <link rel="stylesheet" href="css/dashboard-layout.css" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>

<body class="min-h-screen overflow-x-hidden bg-[#f2f2f3]">
<div id="app">
    <svg class="loading-progress">
        <circle r="40%" cx="50%" cy="50%" />
        <circle r="40%" cx="50%" cy="50%" />
    </svg>
    <div class="loading-progress-text"></div>
</div>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="." class="reload">Reload</a>
    <span class="dismiss">🗙</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
<script type="module" src="js/app.js"></script>
<script src="js/map.js"></script>

<!-- Close user dropdown when clicking outside -->
<script>
    document.addEventListener('click', function (e) {
        const dropdown = document.querySelector('.user-dropdown');
        if (dropdown && !dropdown.contains(e.target)) {
            // Blazor interop to close dropdown — handled via @onclick outside in layout
            // This is a fallback for pure JS close
            dropdown.classList.remove('user-dropdown--open');
        }
    });
</script>
<script src="js/storage.js"></script>
<script src="js/schoolListing.js"></script>
</body>

</html>
